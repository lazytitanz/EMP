<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-emp-theme="dark" data-emp-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMP</title>
  <script src="js/appearance.js?v=2"></script>
  <script>
    try { window.EmpAppearance && window.EmpAppearance.bootFromSession("emp.playback"); } catch (_) {}
  </script>
  <link rel="stylesheet" href="lib/bootstrap/5.3.8/bootstrap.min.css">
  <link rel="stylesheet" href="lib/bootstrap-icons/1.13.1/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/player.css?v=104">
  <link rel="stylesheet" href="css/metadata-editor.css?v=4">
</head>
<body>
  <div id="updateToast" class="update-toast" hidden role="status" aria-live="polite">
    <div class="update-toast-body">
      <div class="update-toast-top">
        <div class="update-toast-icon" aria-hidden="true">
          <i class="bi bi-download"></i>
        </div>
        <div class="update-toast-copy">
          <p class="update-toast-title">EMP update available</p>
          <p class="update-toast-message" data-update-toast-message>A new version of EMP is ready to download.</p>
        </div>
        <button class="update-toast-close" type="button" data-update-toast-action="dismiss" aria-label="Dismiss update notification">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </div>
      <div class="update-toast-actions">
        <button class="update-toast-btn" type="button" data-update-toast-action="dismiss">Later</button>
        <button class="update-toast-btn update-toast-primary" type="button" data-update-toast-action="download">Download</button>
      </div>
    </div>
  </div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><img src="img/emp-icon-512.png" alt=""></span>
        <span class="brand-name">EMP</span>
        <button class="icon-btn brand-collapse-btn" type="button" id="sidebarCollapseBtn" aria-label="Collapse sidebar" data-bs-toggle="tooltip" data-bs-title="Collapse sidebar">
          <i class="bi bi-chevron-bar-left"></i>
        </button>
      </div>

      <nav class="nav-stack" aria-label="Primary">
        <button class="nav-item active" type="button" data-nav="home" data-sidebar-rail-tooltip="Home" aria-label="Home">
          <i class="bi bi-house-fill"></i>
          <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" type="button" data-nav="songs" data-sidebar-rail-tooltip="Songs" aria-label="Songs">
          <i class="bi bi-music-note-beamed"></i>
          <span class="nav-label">All Songs</span>
        </button>
        <button class="nav-item" type="button" data-nav="search" data-sidebar-rail-tooltip="Search" aria-label="Search">
          <i class="bi bi-search"></i>
          <span class="nav-label">Search</span>
        </button>
        <button class="nav-item" type="button" data-nav="settings" data-sidebar-rail-tooltip="Settings" aria-label="Settings">
          <i class="bi bi-gear"></i>
          <span class="nav-label">Settings</span>
        </button>
      </nav>

      <div class="library-panel">
        <div class="library-header">
          <button class="library-title-btn" type="button" data-nav="albums" id="libraryTitleBtn" data-sidebar-rail-tooltip="Your Library" aria-label="Your Library">
            <i class="bi bi-collection-play"></i>
            <span class="nav-label">Browse Library</span>
          </button>
          <div class="library-header-actions">
            <button class="icon-btn" type="button" id="createPlaylistBtn" aria-label="Create" data-bs-toggle="tooltip" data-bs-title="Create">
              <i class="bi bi-plus-lg"></i>
            </button>
            <button class="icon-btn" type="button" id="refreshBtn" aria-label="Refresh library" data-bs-toggle="tooltip" data-bs-title="Refresh library">
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>
        </div>

        <div class="library-panel-body">
          <div class="library-chips-scroll" data-chips-scroll>
            <div class="library-chips">
              <button class="chip active" type="button" data-recents-filter="albums">Albums</button>
              <button class="chip" type="button" data-recents-filter="tracks">Tracks</button>
              <button class="chip" type="button" data-recents-filter="playlists">Playlists</button>
            </div>
          </div>

          <div class="library-tools">
            <label class="library-search">
              <i class="bi bi-search" aria-hidden="true"></i>
              <input type="search" id="librarySearch" placeholder="Search in Your Library" aria-label="Search in Your Library" autocomplete="off">
            </label>
            <button class="library-sort-btn" type="button" id="sidebarSortBtn" data-sidebar-sort aria-label="Sort library list">
              <i class="bi bi-clock-history"></i>
              <span id="sidebarSortLabel">Recents</span>
            </button>
          </div>

          <ul class="playlist-list" id="libraryList"></ul>
        </div>
      </div>

      <div class="sidebar-resize" id="sidebarResize" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>
    </aside>

    <main class="main-stage" id="mainStage">
      <header class="top-bar" id="topBar">
        <div class="history-controls">
          <button class="circle-btn" type="button" id="backBtn" aria-label="Go back" data-bs-toggle="tooltip" data-bs-title="Go back">
            <i class="bi bi-chevron-left"></i>
          </button>
          <button class="circle-btn" type="button" id="forwardBtn" aria-label="Go forward" data-bs-toggle="tooltip" data-bs-title="Go forward">
            <i class="bi bi-chevron-right"></i>
          </button>
        </div>

        <div class="top-collection" id="topCollection" aria-hidden="true" hidden>
          <button class="top-collection-play" type="button" id="topCollectionPlay" aria-label="Play">
            <i class="bi bi-play-fill"></i>
          </button>
          <span class="top-collection-name" id="topCollectionName"></span>
        </div>

        <div class="top-search d-none" id="topSearch">
          <i class="bi bi-search"></i>
          <input type="search" id="searchInput" placeholder="What do you want to play?" aria-label="Search">
        </div>
      </header>

      <section class="view-area" id="viewArea">
        <div class="loading-state" role="status" aria-live="polite">
          <img class="loading-mark" src="img/emp-icon-512.png" alt="" width="48" height="48">
          <p class="loading-title">Loading your library</p>
          <p class="loading-copy">Preparing your music…</p>
        </div>
      </section>
    </main>

    <footer class="player-bar" aria-label="Playback controls">
      <div class="now-playing">
        <button class="now-cover" type="button" id="nowCover" disabled aria-label="Open Now Playing" data-bs-toggle="tooltip" data-bs-title="Open Now Playing">
          <span class="now-cover-expand" aria-hidden="true"><i class="bi bi-arrows-angle-expand"></i></span>
        </button>
        <div class="now-meta">
          <button class="now-title" type="button" id="nowTitle" disabled>Select a track</button>
          <button class="now-artist" type="button" id="nowArtist" disabled>EMP</button>
        </div>
        <button class="text-btn" type="button" id="likeBtn" aria-label="Save to Liked Songs">
          <i class="bi bi-heart"></i>
        </button>
      </div>

      <div class="player-center">
        <div class="transport">
          <button class="text-btn" type="button" id="shuffleBtn" aria-label="Enable shuffle" data-bs-toggle="tooltip" data-bs-title="Shuffle">
            <i class="bi bi-shuffle"></i>
          </button>
          <button class="text-btn" type="button" id="prevBtn" aria-label="Previous" data-bs-toggle="tooltip" data-bs-title="Previous">
            <i class="bi bi-skip-start-fill"></i>
          </button>
          <button class="play-btn" type="button" id="playBtn" aria-label="Play">
            <i class="bi bi-play-fill"></i>
          </button>
          <button class="text-btn" type="button" id="nextBtn" aria-label="Next" data-bs-toggle="tooltip" data-bs-title="Next">
            <i class="bi bi-skip-end-fill"></i>
          </button>
          <button class="text-btn" type="button" id="repeatBtn" aria-label="Repeat" data-bs-toggle="tooltip" data-bs-title="Repeat">
            <i class="bi bi-repeat"></i>
          </button>
        </div>
        <div class="timeline">
          <span id="elapsed">0:00</span>
          <input type="range" class="slider" id="seekBar" min="0" max="1000" value="0" aria-label="Seek">
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <button class="text-btn" type="button" id="lyricsBtn" aria-label="Lyrics" aria-pressed="false" data-bs-toggle="tooltip" data-bs-title="Lyrics">
          <i class="bi bi-mic"></i>
        </button>
        <button class="text-btn" type="button" id="queueBtn" aria-label="Queue" aria-expanded="false" data-bs-toggle="tooltip" data-bs-title="Queue">
          <i class="bi bi-music-note-list"></i>
        </button>
        <button class="text-btn" type="button" id="deviceBtn" aria-label="Connect to a device" data-bs-toggle="tooltip" data-bs-title="Connect to a device">
          <i class="bi bi-speaker"></i>
        </button>
        <div class="volume">
          <button class="text-btn" type="button" id="muteBtn" aria-label="Mute">
            <i class="bi bi-volume-up-fill"></i>
          </button>
          <input type="range" class="slider" id="volumeBar" min="0" max="100" value="80" aria-label="Volume">
        </div>
      </div>
    </footer>

    <!-- Last in DOM so annotated drag regions win over scrolled content. -->
    <div class="window-chrome">
      <div class="window-chrome-drag" aria-hidden="true"></div>
      <div class="window-controls">
        <button class="window-control" type="button" id="winMinimize" aria-label="Minimize" data-bs-toggle="tooltip" data-bs-title="Minimize">
          <i class="bi bi-dash-lg" aria-hidden="true"></i>
        </button>
        <button class="window-control" type="button" id="winMaximize" aria-label="Maximize" data-bs-toggle="tooltip" data-bs-title="Maximize">
          <i class="bi bi-square" aria-hidden="true" data-maximize-icon></i>
        </button>
        <button class="window-control window-control-close" type="button" id="winClose" aria-label="Close" data-bs-toggle="tooltip" data-bs-title="Close">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="device-drawer-root" id="deviceDrawerRoot" hidden>
    <aside class="device-drawer" role="dialog" aria-modal="true" aria-labelledby="deviceDrawerTitle">
      <div class="device-drawer-head">
        <div class="device-drawer-heading">
          <h2 id="deviceDrawerTitle">Connect to a device</h2>
          <p class="device-drawer-sub" id="deviceDrawerStatus" role="status" aria-live="polite"></p>
        </div>
        <button class="device-drawer-close" type="button" id="deviceDrawerClose" aria-label="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="device-drawer-alert" id="deviceDrawerAlert" role="alert" hidden></div>
      <div class="device-drawer-body" id="deviceDrawerBody"></div>
      <div class="device-drawer-foot">
        <p class="device-drawer-note" id="deviceDrawerNote"></p>
        <button class="device-rescan" type="button" id="deviceRescan">
          <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
          <span>Rescan</span>
        </button>
      </div>
    </aside>
  </div>

  <div class="device-drawer-root" id="queueDrawerRoot" hidden>
    <aside class="device-drawer" role="dialog" aria-modal="true" aria-labelledby="queueDrawerTitle">
      <div class="device-drawer-head">
        <div class="device-drawer-heading">
          <h2 id="queueDrawerTitle">Queue</h2>
          <p class="device-drawer-sub" id="queueDrawerStatus" role="status" aria-live="polite"></p>
        </div>
        <div class="queue-drawer-head-actions">
          <button class="device-drawer-close queue-drawer-more" type="button" id="queueDrawerMore" aria-label="Queue options" aria-haspopup="menu" aria-expanded="false">
            <i class="bi bi-three-dots"></i>
          </button>
          <button class="device-drawer-close" type="button" id="queueDrawerClose" aria-label="Close">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
      </div>
      <div class="device-drawer-body" id="queueDrawerBody"></div>
    </aside>
  </div>

  <div class="settings-overlay-root" id="settingsOverlayRoot" hidden>
    <div class="settings-overlay-backdrop" data-settings-backdrop aria-hidden="true"></div>
    <div class="settings-overlay-shell" role="dialog" aria-modal="true" aria-labelledby="settingsOverlayTitle">
      <nav class="settings-overlay-nav" aria-label="Settings sections" data-settings-nav></nav>
      <div class="settings-overlay-main">
        <div class="settings-overlay-top">
          <div class="settings-overlay-heading">
            <h1 id="settingsOverlayTitle" data-settings-title>Settings</h1>
            <p data-settings-description></p>
          </div>
          <button class="settings-overlay-close" type="button" data-settings-close aria-label="Close settings">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
          </button>
        </div>
        <div class="settings-overlay-body" data-settings-body tabindex="-1"></div>
      </div>
    </div>
  </div>

  <script src="lib/bootstrap/5.3.8/bootstrap.bundle.min.js"></script>
  <script src="js/eq-presets.js?v=3"></script>
  <script src="js/mixes.js?v=1"></script>
  <script src="js/listen-date-split.js?v=1"></script>
  <script src="js/replay-gain.js?v=1"></script>
  <script src="js/playback-transitions.js?v=1"></script>
  <script src="js/queue-model.js?v=1"></script>
  <script src="js/sonora-volume.js?v=1"></script>
  <script src="js/sonora-preamp.js?v=2"></script>
  <script src="js/settings-overlay.js?v=7"></script>
  <script src="js/listening-insights.js?v=2"></script>
  <script src="js/sonora-bridge.js?v=8"></script>
  <script src="js/sonora-playback-errors.js?v=1"></script>
  <script src="js/smart-playlists.js?v=1"></script>
  <script src="js/smart-playlist-editor.js?v=4"></script>
  <script src="js/metadata-editor.js?v=2"></script>
  <script src="js/now-playing-ambient.js?v=5"></script>
  <script src="js/player.js?v=98"></script>
</body>
</html>
