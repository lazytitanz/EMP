<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMP</title>
  <link rel="stylesheet" href="lib/bootstrap/5.3.8/bootstrap.min.css">
  <link rel="stylesheet" href="lib/bootstrap-icons/1.13.1/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/player.css?v=41">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><img src="img/music.png" alt=""></span>
        <span class="brand-name">EMP</span>
      </div>

      <nav class="nav-stack" aria-label="Primary">
        <button class="nav-item active" type="button" data-nav="home">
          <i class="bi bi-house-fill"></i>
          <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" type="button" data-nav="search">
          <i class="bi bi-search"></i>
          <span class="nav-label">Search</span>
        </button>
        <button class="nav-item" type="button" data-nav="settings">
          <i class="bi bi-gear"></i>
          <span class="nav-label">Settings</span>
        </button>
      </nav>

      <div class="library-panel">
        <div class="library-header">
          <button class="library-title-btn" type="button" data-nav="albums" id="libraryTitleBtn" aria-label="Your Library">
            <i class="bi bi-collection-play"></i>
            <span class="nav-label">Your Library</span>
          </button>
          <div class="library-header-actions">
            <button class="icon-btn" type="button" id="createPlaylistBtn" aria-label="Create playlist" data-bs-toggle="tooltip" data-bs-title="Create playlist">
              <i class="bi bi-plus-lg"></i>
            </button>
            <button class="icon-btn" type="button" id="refreshBtn" aria-label="Refresh library" data-bs-toggle="tooltip" data-bs-title="Refresh library">
              <i class="bi bi-arrow-clockwise"></i>
            </button>
            <button class="icon-btn" type="button" id="sidebarCollapseBtn" aria-label="Collapse sidebar" data-bs-toggle="tooltip" data-bs-title="Collapse sidebar">
              <i class="bi bi-arrows-angle-contract"></i>
            </button>
          </div>
        </div>

        <div class="library-panel-body">
          <div class="library-chips-scroll" data-chips-scroll>
            <div class="library-chips">
              <button class="chip active" type="button" data-recents-filter="albums">Albums</button>
              <button class="chip" type="button" data-recents-filter="tracks">Tracks</button>
              <button class="chip" type="button" data-recents-filter="playlists">Playlists</button>
            </div>
          </div>

          <div class="library-tools">
            <label class="library-search">
              <i class="bi bi-search" aria-hidden="true"></i>
              <input type="search" id="librarySearch" placeholder="Search in Your Library" aria-label="Search in Your Library" autocomplete="off">
            </label>
            <button class="library-sort-btn" type="button" id="sidebarSortBtn" data-sidebar-sort aria-label="Sort library list">
              <i class="bi bi-clock-history"></i>
              <span id="sidebarSortLabel">Recents</span>
            </button>
          </div>

          <ul class="playlist-list" id="libraryList"></ul>
        </div>
      </div>

      <div class="sidebar-resize" id="sidebarResize" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>
    </aside>

    <main class="main-stage" id="mainStage">
      <header class="top-bar">
        <div class="history-controls">
          <button class="circle-btn" type="button" id="backBtn" aria-label="Go back" data-bs-toggle="tooltip" data-bs-title="Go back">
            <i class="bi bi-chevron-left"></i>
          </button>
          <button class="circle-btn" type="button" id="forwardBtn" aria-label="Go forward" data-bs-toggle="tooltip" data-bs-title="Go forward">
            <i class="bi bi-chevron-right"></i>
          </button>
        </div>

        <div class="top-search d-none" id="topSearch">
          <i class="bi bi-search"></i>
          <input type="search" id="searchInput" placeholder="What do you want to play?" aria-label="Search">
        </div>
      </header>

      <section class="view-area" id="viewArea">
        <div class="loading-state">Scanning your music library…</div>
      </section>
    </main>

    <footer class="player-bar" aria-label="Playback controls">
      <div class="now-playing">
        <button class="now-cover" type="button" id="nowCover" disabled aria-label="Open album"></button>
        <div class="now-meta">
          <button class="now-title" type="button" id="nowTitle" disabled>Select a track</button>
          <button class="now-artist" type="button" id="nowArtist" disabled>EMP</button>
        </div>
        <button class="text-btn" type="button" id="likeBtn" aria-label="Save to Liked Songs">
          <i class="bi bi-heart"></i>
        </button>
      </div>

      <div class="player-center">
        <div class="transport">
          <button class="text-btn" type="button" id="shuffleBtn" aria-label="Enable shuffle" data-bs-toggle="tooltip" data-bs-title="Shuffle">
            <i class="bi bi-shuffle"></i>
          </button>
          <button class="text-btn" type="button" id="prevBtn" aria-label="Previous" data-bs-toggle="tooltip" data-bs-title="Previous">
            <i class="bi bi-skip-start-fill"></i>
          </button>
          <button class="play-btn" type="button" id="playBtn" aria-label="Play">
            <i class="bi bi-play-fill"></i>
          </button>
          <button class="text-btn" type="button" id="nextBtn" aria-label="Next" data-bs-toggle="tooltip" data-bs-title="Next">
            <i class="bi bi-skip-end-fill"></i>
          </button>
          <button class="text-btn" type="button" id="repeatBtn" aria-label="Repeat" data-bs-toggle="tooltip" data-bs-title="Repeat">
            <i class="bi bi-repeat"></i>
          </button>
        </div>
        <div class="timeline">
          <span id="elapsed">0:00</span>
          <input type="range" class="slider" id="seekBar" min="0" max="1000" value="0" aria-label="Seek">
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <button class="text-btn" type="button" id="deviceBtn" aria-label="Connect to a device" data-bs-toggle="tooltip" data-bs-title="Connect to a device">
          <i class="bi bi-speaker"></i>
        </button>
        <div class="volume">
          <button class="text-btn" type="button" id="muteBtn" aria-label="Mute">
            <i class="bi bi-volume-up-fill"></i>
          </button>
          <input type="range" class="slider" id="volumeBar" min="0" max="100" value="80" aria-label="Volume">
        </div>
      </div>
    </footer>
  </div>

  <div class="device-drawer-root" id="deviceDrawerRoot" hidden>
    <aside class="device-drawer" role="dialog" aria-modal="true" aria-labelledby="deviceDrawerTitle">
      <div class="device-drawer-head">
        <h2 id="deviceDrawerTitle">Connect to a device</h2>
        <button class="details-modal-close" type="button" id="deviceDrawerClose" aria-label="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="device-drawer-body" id="deviceDrawerBody"></div>
    </aside>
  </div>

  <script src="lib/bootstrap/5.3.8/bootstrap.bundle.min.js"></script>
  <script src="js/eq-presets.js?v=2"></script>
  <script src="js/player.js?v=35"></script>
</body>
</html>
